<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Travel Planner — Plan Your Next Adventure</title>
    <meta
      name="description"
      content="Plan your next adventure with interactive maps, 3D globe exploration, and smart itinerary management. Your all-in-one travel planning companion."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Travel Planner — Plan Your Next Adventure" />
    <meta
      property="og:description"
      content="Plan your next adventure with interactive maps, 3D globe exploration, and smart itinerary management."
    />
    <meta property="og:url" content="https://travelplanner.app" />
    <meta property="og:site_name" content="Travel Planner" />
    <meta property="og:locale" content="en_US" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- SVG Filter for Text Inner Shadow -->
    <svg
      width="0"
      height="0"
      style="position: absolute; width: 0; height: 0; pointer-events: none"
      aria-hidden="true"
    >
      <filter id="text-inner-shadow">
        <!-- Offset the alpha channel (shape of the text) down and slightly right -->
        <feOffset dx="1" dy="2" in="SourceAlpha" result="offset" />
        <!-- Blur it slightly to soften the edge of the shadow -->
        <feGaussianBlur stdDeviation="1.5" in="offset" result="blur" />
        <!-- Subtract the blurred/offset shape from the original shape, leaving just the top/left inside edges -->
        <feComposite operator="out" in="SourceAlpha" in2="blur" result="inverse" />
        <!-- Define the shadow color (dark reddish-black) -->
        <feFlood flood-color="#3A0810" flood-opacity="0.65" result="color" />
        <!-- Mask the color strictly to those inside edges -->
        <feComposite operator="in" in="color" in2="inverse" result="shadow" />
        <!-- Composite the shadow on top of the original text -->
        <feComposite operator="over" in="shadow" in2="SourceGraphic" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
